<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.css"><style>body{margin:0;font:16px/1.6 system-ui;color:#2c5138}#msg{padding:25px}#msg:empty{display:none}</style></head><body><p id="msg" role="status">브라우저에서 파이썬을 준비하고 있어요.</p><div id="root"></div><script type="module">
const parentOrigin = new URL(location.href).origin;
window.addEventListener("message", async function receive(event) {
  if(event.source!==parent || event.origin!==parentOrigin || typeof event.data?.code!=="string") return;
  window.removeEventListener("message",receive);
  const message=document.getElementById("msg");
  try {
    const {mount}=await import("https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.js");
    await mount({entrypoint:"app.py",files:{"app.py":event.data.code,...event.data.support},streamlitConfig:{"theme.base":"light","theme.primaryColor":"#286947","client.toolbarMode":"minimal"}},document.getElementById("root"));
    message.textContent="";
  } catch (e){console.error(e);message.textContent="실행 환경을 열지 못했어요. 코드를 파일로 받아 내 Streamlit 앱에서 실행할 수 있습니다.";}
});
parent.postMessage("ready",parentOrigin);
</script></body></html>
